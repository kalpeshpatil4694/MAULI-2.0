name: Deploy MAULI 2.0 Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Deploying MAULI 2.0 Worker..."
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 30))
              echo "Cloudflare API may be throttling. Waiting ${wait}s before retry..."
              sleep "$wait"
            fi
          done
          echo "::error::Cloudflare deployment failed after 3 attempts."
          exit 1

# Direct Wrangler deployment is the source of truth; Cloudflare Workers Builds is intentionally disconnected.
