name: Deploy MAULI 2.0 Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Result writer GitHub token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAULI_GITHUB_TOKEN: ${{ secrets.MAULI_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(npx wrangler secret list --format json)"
          if echo "$existing" | jq -e '.[] | select(.name == "GITHUB_TOKEN")' >/dev/null; then
            echo "GITHUB_TOKEN already configured on Worker"
            exit 0
          fi
          if [ -z "${MAULI_GITHUB_TOKEN:-}" ]; then
            echo "::error::Worker is missing GITHUB_TOKEN and GitHub Actions secret MAULI_GITHUB_TOKEN is not configured. Add MAULI_GITHUB_TOKEN as a repository secret, then rerun deployment."
            exit 1
          fi
          printf '%s' "$MAULI_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
