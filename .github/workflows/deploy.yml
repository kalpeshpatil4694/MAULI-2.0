name: Deploy MAULI 2.0 Worker

on:
  workflow_run:
    workflows: ["MAULI 2.0 L1 CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Deploying tested MAULI 2.0 revision..."
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 30))
              echo "Cloudflare API may be throttling. Waiting ${wait}s before retry..."
              sleep "$wait"
            fi
          done
          echo "::error::Cloudflare deployment failed after 3 attempts."
          exit 1
