name: MAULI 2.0 Tests

# Manual regression workflow. Automatic validation is owned by l1-ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-manual-tests
  cancel-in-progress: true

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
