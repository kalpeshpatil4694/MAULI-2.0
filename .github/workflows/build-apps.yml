name: Build Apps
on:
  push:
    branches: ['build/**']
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check www folder
        id: check
        run: |
          if [ -d "www" ] && [ -f "www/index.html" ]; then
            echo "has_www=true" >> $GITHUB_OUTPUT
          else
            echo "has_www=false" >> $GITHUB_OUTPUT
            echo "No www/ folder - skipping Android build"
          fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.has_www == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_www == 'true'
        with:
          node-version: 20
      - name: Install dependencies
        if: steps.check.outputs.has_www == 'true'
        run: npm install
      - name: Install Capacitor
        if: steps.check.outputs.has_www == 'true'
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Init Capacitor
        if: steps.check.outputs.has_www == 'true'
        run: npx cap init my-app com.mauli.app --web-dir www || true
      - name: Add Android
        if: steps.check.outputs.has_www == 'true'
        run: npx cap add android || true
      - name: Sync web assets
        if: steps.check.outputs.has_www == 'true'
        run: npx cap sync
      - name: Build Android APK
        if: steps.check.outputs.has_www == 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.check.outputs.has_www == 'true' && success()
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check electron folder
        id: check
        run: |
          if [ -d "electron" ] && [ -f "electron/main.js" ]; then
            echo "has_electron=true" >> $GITHUB_OUTPUT
          else
            echo "has_electron=false" >> $GITHUB_OUTPUT
            echo "No electron/ folder - skipping desktop build"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_electron == 'true'
        with:
          node-version: 20
      - name: Install dependencies
        if: steps.check.outputs.has_electron == 'true'
        run: npm install
      - name: Install Electron
        if: steps.check.outputs.has_electron == 'true'
        run: npm install electron electron-builder --save-dev
      - name: Build Desktop App
        if: steps.check.outputs.has_electron == 'true'
        run: npx electron-builder --linux --dir
      - name: Upload build
        uses: actions/upload-artifact@v4
        if: steps.check.outputs.has_electron == 'true' && success()
        with:
          name: linux-desktop
          path: dist/
