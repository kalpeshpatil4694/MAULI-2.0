name: Build Apps (.apk and .exe)
on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project structure
        id: check
        run: |
          if [ -d "www" ] && [ -f "www/index.html" ]; then
            echo "has_www=true" >> $GITHUB_OUTPUT
          else
            echo "has_www=false" >> $GITHUB_OUTPUT
            mkdir -p www
            echo '<!DOCTYPE html><html><head><title>MAULI App</title></head><body style="background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh"><div style="text-align:center"><h1>MAULI 2.0</h1><p>Generated App</p></div></body></html>' > www/index.html
          fi

      - name: Setup and build Android
        if: steps.check.outputs.has_www == 'true'
        run: |
          cat > package.json << 'JSONEOF'
          {"name":"mauli-app","version":"1.0.0","main":"electron/main.js"}
          JSONEOF
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init mauli-app com.mauli.app --web-dir www || true
          npx cap add android || true
          npx cap sync android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mauli-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  build-desktop:
    name: Build Desktop App
    if: startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup project
        run: |
          if [ ! -f "package.json" ]; then
            echo '{"name":"mauli-desktop","version":"1.0.0","main":"electron/main.js"}' > package.json
          fi
          mkdir -p electron www
          if [ ! -f "electron/main.js" ]; then
            echo 'const{app,BrowserWindow}=require("electron");const path=require("path");function createWindow(){const win=new BrowserWindow({width:800,height:600});win.loadFile(path.join(__dirname,"../www/index.html"));}app.whenReady().then(createWindow);app.on("window-all-closed",()=>{if(process.platform!=="darwin")app.quit()});' > electron/main.js
          fi
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>MAULI</title></head><body style="background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh"><h1>MAULI 2.0 Desktop</h1></body></html>' > www/index.html
          fi
          npm install electron@28 electron-builder@24

      - name: Build Desktop
        run: npx electron-builder --linux AppImage --publish never || true

      - name: Upload Desktop
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mauli-desktop-exe
          path: dist/*.AppImage
          if-no-files-found: warn
          retention-days: 14
