name: Build Apps (.apk and .exe)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-app-build-latest
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require generated application source
        run: |
          set -e
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css
          test -s package.json
          test -s capacitor.config.json
          ! grep -R -E '\[object Object\]|Application is ready\.|User interface ready|Application logic ready|Build pipeline ready' www
          test "$(wc -c < www/app.js)" -ge 160
          grep -Eq 'addEventListener|onclick|function ' www/app.js
          echo "Real generated application source verified"

      - name: Build Android from generated source
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-desktop:
    name: Build Desktop App
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require generated application source
        run: |
          set -e
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css
          ! grep -R -E '\[object Object\]|Application is ready\.|User interface ready|Application logic ready|Build pipeline ready' www
          test "$(wc -c < www/app.js)" -ge 160
          grep -Eq 'addEventListener|onclick|function ' www/app.js
          echo "Real generated application source verified"

      - name: Setup project
        run: |
          test -s package.json
          mkdir -p electron
          test -s electron/main.js || printf '%s\n' 'const{app,BrowserWindow}=require("electron");const path=require("path");function createWindow(){const win=new BrowserWindow({width:800,height:600});win.loadFile(path.join(__dirname,"../www/index.html"));}app.whenReady().then(createWindow);app.on("window-all-closed",()=>{if(process.platform!=="darwin")app.quit()});' > electron/main.js
          npm install --no-audit --no-fund --save-dev electron@28 electron-builder@24
      - name: Build Desktop
        run: npx electron-builder --linux AppImage --publish never
      - name: Verify Desktop Artifact
        run: test -s dist/*.AppImage
      - name: Upload Desktop
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
