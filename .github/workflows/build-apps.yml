name: Build Apps (.apk and .exe)

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mauli-app-build-latest
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Functional application quality gate
        run: |
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css
          grep -q '<button\|addEventListener\|onclick' www/index.html www/app.js
          ! grep -q '\[object Object\]' www/index.html www/app.js
          ! grep -q 'This application was generated by MAULI 2.0 AI Company.' www/index.html
          ! grep -q 'Generated App' www/index.html
          ! grep -q 'Main Application Logic' www/app.js

      - name: Setup and build Android
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init mauli-app com.mauli.app --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-desktop:
    name: Build Desktop App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Functional application quality gate
        run: |
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css
          grep -q '<button\|addEventListener\|onclick' www/index.html www/app.js
          ! grep -q '\[object Object\]' www/index.html www/app.js
          ! grep -q 'This application was generated by MAULI 2.0 AI Company.' www/index.html
          ! grep -q 'Generated App' www/index.html
          ! grep -q 'Main Application Logic' www/app.js

      - name: Setup project
        run: |
          test -s package.json || printf '%s\n' '{"name":"mauli-desktop","version":"1.0.0","main":"electron/main.js"}' > package.json
          mkdir -p electron www
          test -s electron/main.js || printf '%s\n' 'const{app,BrowserWindow}=require("electron");const path=require("path");function createWindow(){const win=new BrowserWindow({width:800,height:600});win.loadFile(path.join(__dirname,"../www/index.html"));}app.whenReady().then(createWindow);app.on("window-all-closed",()=>{if(process.platform!=="darwin")app.quit()});' > electron/main.js
          npm install --no-audit --no-fund electron@28 electron-builder@24
      - name: Build Desktop
        run: npx electron-builder --linux AppImage --publish never
      - name: Verify Desktop Artifact
        run: test -s dist/*.AppImage
      - name: Upload Desktop
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
