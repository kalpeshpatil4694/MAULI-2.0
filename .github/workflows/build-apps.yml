name: MAULI App Build

# /api/build-app pushes a project's generated files onto a `build/*` branch and
# relies on a push to that branch to start packaging. The worker used to generate
# its own copy of this workflow per build, but writing files under
# `.github/workflows` needs a token scope the worker's GITHUB_TOKEN does not have,
# so that PUT failed silently and no build ever ran. Keeping the workflow here in
# the repository means the pushes the worker can already make are enough.

on:
  push:
    branches:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: read

# The worker pushes the project one file at a time, so a single build would start
# several times. Only the run for the final push needs to finish.
concurrency:
  group: mauli-app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the generated app is present
        run: |
          set -e
          test -s www/index.html
          test -s package.json
          echo "App files validated"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
      - name: Add Android platform
        run: npx cap init mauli-app com.mauli.app --web-dir www
        continue-on-error: true
      - name: Build APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          set -e
          ls -l android/app/build/outputs/apk/debug/*.apk
          echo "APK built successfully"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the generated app is present
        run: test -s www/index.html
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Electron
        run: npm install electron electron-builder --save-dev --no-audit --no-fund
      - name: Build Linux app
        run: npx electron-builder --linux --dir
      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist/
          if-no-files-found: error
          retention-days: 14
