name: Build Apps (.apk and .exe)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Init Capacitor
        run: npx cap init mauli-app com.mauli.app --web-dir www || true
      - name: Add Android platform
        run: npx cap add android || true
      - name: Sync web assets
        run: npx cap sync
      - name: Build Android APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mauli-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-linux-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Electron
        run: npm install electron electron-builder --save-dev
      - name: Build Linux EXE
        run: npx electron-builder --linux --dir
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: mauli-linux-exe
          path: dist/

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Electron
        run: npm install electron electron-builder --save-dev
      - name: Build Windows EXE
        run: npx electron-builder --win --dir
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mauli-windows-exe
          path: dist/
