name: Build Lifecycle Fix
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply audited build lifecycle fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/index.js')
          s=p.read_text()
          s=s.replace("import { ensureSchema, hasD1, d1List, d1Events } from './db.js';", "import { ensureSchema, hasD1, d1List, d1Events, claimBuildVersion, getBuildVersion } from './db.js';")
          old="const buildId='build_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);\n    const buildBranch='build/'+buildId;"
          new="const buildId='build_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);\n    const safeProjectId=String(projectId).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,80)||'unknown';\n    const buildBranch='build/project-'+safeProjectId;\n    const startedAt=now();\n    const previousBuilds=store.list('builds').filter(b=>b.projectId===projectId&&!['success','failed','cancelled','superseded'].includes(b.status));\n    for(const previous of previousBuilds) store.put('builds',{...previous,status:'superseded',supersededBy:buildId,supersededAt:startedAt});\n    if(hasD1(env)) await claimBuildVersion(env,projectId,buildId,buildBranch,startedAt); else store.put('build_locks',{id:'project:'+projectId,projectId,buildId,branch:buildBranch,startedAt,status:'active'});"
          assert old in s, 'build id block not found'
          s=s.replace(old,new,1)
          old="const mainRef=await fetch('https://api.github.com/repos/'+repo+'/git/refs/heads/main',{headers:ghHeaders});\n    const mainData=await mainRef.json();\n    const mainSha=mainData?.object?.sha;\n    if(mainSha){\n      await fetch('https://api.github.com/repos/'+repo+'/git/refs',{method:'POST',headers:ghHeaders,body:JSON.stringify({ref:'refs/heads/'+buildBranch,sha:mainSha})});\n    }"
          new="const mainRef=await fetch('https://api.github.com/repos/'+repo+'/git/refs/heads/main',{headers:ghHeaders});\n    const mainData=await mainRef.json();\n    const mainSha=mainData?.object?.sha;\n    if(!mainSha)return fail('Unable to resolve main branch',502,{buildId,repo});\n    const branchRuns=await fetch('https://api.github.com/repos/'+repo+'/actions/runs?branch='+encodeURIComponent(buildBranch)+'&per_page=20',{headers:ghHeaders}).then(r=>r.ok?r.json():({workflow_runs:[]})).catch(()=>({workflow_runs:[]}));\n    for(const run of branchRuns.workflow_runs||[]) if(['queued','in_progress'].includes(run.status)){await fetch('https://api.github.com/repos/'+repo+'/actions/runs/'+run.id+'/cancel',{method:'POST',headers:ghHeaders}).catch(()=>{});}\n    await fetch('https://api.github.com/repos/'+repo+'/git/refs/heads/'+encodeURIComponent(buildBranch),{method:'DELETE',headers:ghHeaders}).catch(()=>{});\n    const createBranch=await fetch('https://api.github.com/repos/'+repo+'/git/refs',{method:'POST',headers:ghHeaders,body:JSON.stringify({ref:'refs/heads/'+buildBranch,sha:mainSha})});\n    if(!createBranch.ok){const text=await createBranch.text().catch(()=>\"\");return fail('Unable to create clean build branch',502,{buildId,repo,branch:buildBranch,error:text.substring(0,200)});}"
          assert old in s, 'branch creation block not found'
          s=s.replace(old,new,1)
          old="for(const file of files){\n      const path=file.path;"
          new="for(const file of files){\n      const current=hasD1(env)?await getBuildVersion(env,projectId):store.get('build_locks','project:'+projectId);\n      if(current?.buildId!==buildId)return ok({buildId,status:'superseded',supersededBy:current?.buildId||null,pushed});\n      const path=file.path;"
          assert old in s, 'file loop block not found'
          s=s.replace(old,new,1)
          old="wfLines.push('on: push');\n    wfLines.push('concurrency:');\n    wfLines.push('  group: mauli-build-\\${{ github.ref }}');"
          new="wfLines.push('on:');\n    wfLines.push('  push:');\n    wfLines.push('    paths:');\n    wfLines.push(\"      - '.github/workflows/build-apps.yml'\");\n    wfLines.push('concurrency:');\n    wfLines.push('  group: mauli-build-\\${{ github.ref }}');"
          assert old in s, 'workflow trigger block not found'
          s=s.replace(old,new,1)
          old="const wfContent=wfLines.join('\\n');"
          new="const latestBeforeWorkflow=hasD1(env)?await getBuildVersion(env,projectId):store.get('build_locks','project:'+projectId);\n    if(latestBeforeWorkflow?.buildId!==buildId)return ok({buildId,status:'superseded',supersededBy:latestBeforeWorkflow?.buildId||null,pushed});\n    const wfContent=wfLines.join('\\n');"
          assert old in s, 'workflow content block not found'
          s=s.replace(old,new,1)
          old="store.put('builds',{id:buildId,projectId,platform,repo,branch:buildBranch,pushedAt:now(),status:pushed>0?'pushed':'failed',filesPushed:pushed});"
          new="store.put('builds',{id:buildId,projectId,platform,repo,branch:buildBranch,pushedAt:now(),startedAt,status:pushed>0?'pushed':'failed',filesPushed:pushed,supersededBy:null});"
          assert old in s, 'build store block not found'
          s=s.replace(old,new,1)
          old="const build=store.list('builds').find(b=>b.id===buildId);\n    if(!build)return fail('Build not found',404);"
          new="const build=store.list('builds').find(b=>b.id===buildId);\n    if(!build)return fail('Build not found',404);\n    if(build.status==='superseded')return ok({buildId,status:'superseded',supersededBy:build.supersededBy||null,downloadUrl:null,pushedAt:build.pushedAt,platform:build.platform,filesPushed:build.filesPushed});"
          assert old in s, 'build status lookup block not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/db.js')
          s=p.read_text()
          assert 'export async function claimBuildVersion' not in s, 'db helper already exists'
          s=s.rstrip()+"""\n\nexport async function claimBuildVersion(env, projectId, buildId, branch, startedAt) {\n  if (!hasD1(env)) return false;\n  return d1Put(env, 'build_locks', { id: 'project:' + projectId, projectId, buildId, branch, startedAt, status: 'active' });\n}\n\nexport async function getBuildVersion(env, projectId) {\n  if (!hasD1(env)) return null;\n  const row = await env.DB.prepare('SELECT data FROM entities WHERE type = ? AND id = ? LIMIT 1').bind('build_locks', 'project:' + projectId).first();\n  return row?.data ? JSON.parse(row.data) : null;\n}\n"""
          p.write_text(s)
          PY
      - name: Validate changed JavaScript
        run: |
          node --check src/index.js
          node --check src/db.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/db.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: enforce latest build lifecycle per project"
          git push
