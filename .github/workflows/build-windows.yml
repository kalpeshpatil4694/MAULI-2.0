name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source
        run: |
          if not exist www\index.html (
            if not exist src\main.js (
              echo "No web or electron source found"
              exit /b 1
            )
          )
          if not exist package.json exit /b 1
          echo "Source validated"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Electron
        run: |
          if not exist electron\main.js (
            mkdir electron
            echo const{app,BrowserWindow}=require("electron");const path=require("path");function createWindow(){const win=new BrowserWindow({width:1200,height:800});win.loadFile(path.join(__dirname,"../www/index.html"));}app.whenReady().then(createWindow);app.on("window-all-closed",()=>{if(process.platform!=="darwin")app.quit()}); > electron\main.js
          )
          npm install --no-audit --no-fund --save-dev electron@28 electron-builder@24

      - name: Build Windows .exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify artifact
        run: if not exist dist\*.exe echo "WARNING: No .exe found"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: warn
          retention-days: 14
