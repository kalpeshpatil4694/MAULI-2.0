name: MAULI 2.0 L1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-test:
    name: L1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Deterministic installs from the committed lockfile. A floating `npm install`
      # re-resolved wrangler on every run, so a deploy could ship a version the tests
      # never saw. `npm ci` also fails loudly if package.json and the lockfile diverge.
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Syntax / lint
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:routes

      # Proves the generated-app runtime verifier can actually execute a generated app and
      # tell a working app from a demo. MAULI must never ship a demo for a working product.
      - name: Generated-app runtime verification
        run: npm run test:runtime

      # Executes a generated product end to end: its Worker runs against a real D1 binding,
      # its session is enforced, its data survives a refresh and its live channel carries a
      # write to another client. Also proves the journey CATCHES a backend that fakes
      # success — "the backend is executed, not scanned".
      - name: Founder user journey (real backend execution)
        run: npm run verify:journey

      # Production Runtime Acceptance, the gate between Functional Fidelity and QA.
      # The engine's own contract: a real generated product passes, a static-JSON backend is
      # caught as fake, a backend with no evidence is BLOCKED, a missing external credential
      # is DEPENDENCY_REQUIRED, and no critical requirement may lack runtime evidence.
      - name: Production runtime acceptance engine
        run: npm run verify:runtime

      # The deployment + identity contract: A backend + D1, B Backend + Auth,
      # C external API, D realtime, E browser-only, F executor unavailable,
      # G deployment failure, H wrong deployment URL, I wrong project identity,
      # J critical requirement without evidence, K repair → redeploy → retest,
      # L successful full delivery — plus the repair-loop bound.
      - name: Generated deployment + identity matrix
        run: npm run verify:deployment

      - name: Security + governance tests
        run: npm run test:security

      - name: Deep self-test
        run: npm run self-test

      - name: Wrangler configuration validation
        run: npx wrangler deploy --dry-run

      # A dry-run bundle proves the Worker compiles and the entry module exists. The
      # output directory is discarded; the deploy job rebuilds from the same revision.
      - name: Build verification
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir .build-check
          test -s .build-check/worker.js

  deploy:
    name: Deploy tested revision
    needs: l1-test
    if: ${{ github.event_name != 'pull_request' && needs.l1-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Cloudflare deployment failed after 3 attempts."
          exit 1

      # deploy → smoke → production runtime acceptance → final gate. The smoke proves the
      # MAULI Worker itself answers after a deploy.
      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          BASE="${MAULI_BASE_URL:-https://mauli-2-0.kalpeshpatil4694.workers.dev}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$BASE/api/health" | grep -q '"status"'; then
              echo "Smoke test passed: $BASE/api/health"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Post-deploy smoke test failed for $BASE/api/health"
          exit 1
        env:
          MAULI_BASE_URL: ${{ vars.MAULI_BASE_URL }}

      # Production runtime acceptance is AUTOMATIC and PER PROJECT. There is no fixed
      # MAULI_RUNTIME_PROJECT here any more: the sweep asks MAULI itself which projects have
      # generated code and no passing runtime evidence, and MAULI answers for each one by
      # deploying it (when a deploy executor is configured) and running the acceptance over
      # real HTTP against that project's own URL.
      #
      # It never reports a PASS it did not earn. A project with no runtime executor, no
      # deploy executor or no credential comes back BLOCKED / DEPENDENCY_REQUIRED, and
      # that is the honest end state — the gate, not this job, decides what may ship.
      #
      # `vars.MAULI_RUNTIME_PROJECT` survives ONLY as an optional single-project fixture
      # filter for debugging; production acceptance does not depend on it.
      - name: Production runtime acceptance (every generated project)
        env:
          MAULI_BASE_URL: ${{ vars.MAULI_BASE_URL }}
          MAULI_KEY: ${{ secrets.MAULI_FOUNDER_KEY }}
          MAULI_RUNTIME_FIXTURE: ${{ vars.MAULI_RUNTIME_PROJECT }}
        run: |
          set -euo pipefail
          # No founder key means the sweep cannot authenticate. That is a configuration gap,
          # not a product failure, so it is reported and the step ends without claiming
          # anything. (A step-level `if` cannot read `secrets` — hence the guard in-script.)
          if [ -z "${MAULI_KEY:-}" ]; then
            echo "::notice::MAULI_FOUNDER_KEY is not configured; the per-project runtime sweep is skipped and every generated project stays BLOCKED on runtime evidence."
            exit 0
          fi
          BASE="${MAULI_BASE_URL:-https://mauli-2-0.kalpeshpatil4694.workers.dev}"
          if [ -n "${MAULI_RUNTIME_FIXTURE:-}" ]; then
            echo "::notice::Fixture mode: only project ${MAULI_RUNTIME_FIXTURE} is re-tested. Production acceptance is per project and does not use this variable."
            BODY="{\"projectId\":\"${MAULI_RUNTIME_FIXTURE}\"}"
          else
            BODY='{"limit":25}'
          fi
          curl -fsS --max-time 600 -X POST "${BASE}/api/runtime-acceptance/sweep" \
            -H "x-mauli-founder: ${MAULI_KEY}" -H 'content-type: application/json' \
            -d "${BODY}" | tee /tmp/runtime-sweep.json
          echo
          node -e '
            const r=JSON.parse(require("fs").readFileSync("/tmp/runtime-sweep.json","utf8"));
            const d=r.data??r;
            console.log(`  swept ${d.swept} project(s); runtime executor: ${d.executorConfigured}, deploy executor: ${d.deployExecutorConfigured}`);
            let blocked=0;
            for(const p of (d.projects??[])){
              if(p.blocked) blocked++;
              console.log(`  ${p.blocked?"BLOCKED":"EVIDENCE"} ${p.projectId} — ${p.verdict}${p.reason?" ("+p.reason+")":""}`);
            }
            // A blocked project is NOT a CI failure: the platform records it honestly and the
            // production-runtime gate refuses delivery. Failing this job would hide the real
            // verdict behind a red X that says nothing about which product was blocked.
            if(!(d.projects??[]).length) console.log("  no generated project is awaiting a runtime acceptance run");
            else console.log(`  ${blocked} project(s) BLOCKED on runtime evidence — their Final Delivery stays blocked.`);
          '

# Persistence stack is Workers + D1 + Durable Objects + Workers AI only. There is no
# object-storage binding of any kind, so deployment and CI must never require one.
