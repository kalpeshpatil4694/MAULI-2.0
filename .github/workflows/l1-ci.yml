name: MAULI 2.0 L1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-test:
    name: L1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax check
        run: node --check src/index.js && node --check src/orchestrator.js

      - name: Run complete test suite
        run: npm test

      - name: Run deep self-test
        run: node --test tests/*.test.js

      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run
