name: MAULI 2.0 Single Gate CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mauli-single-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Single Gate — All Tests + Integration + Build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v4

      - name: Verify exact commit under test
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) { throw "GITHUB_SHA is empty" }
          Write-Host "Commit SHA: $env:GITHUB_SHA"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA" -Headers $headers -Method Get
          if ($commit.sha -ne $env:GITHUB_SHA) { throw "GitHub API commit SHA does not match GITHUB_SHA" }
          Write-Host "Verified exact GitHub commit: $($commit.sha)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax check
        run: |
          node --check src/index.js
          node --check src/observer.js
          node --check src/observer-dashboard.js

      - name: MAULI Self Tests
        run: npm test

      - name: MAULI L1 Tests
        run: npm test

      - name: MAULI integration self-tests
        run: |
          node --input-type=module -e "import('./src/orchestrator-selftest.js').then(async ({runOrchestratorSelfTest}) => { const {runAgentRecoverySelfTest}=await import('./src/e2e-selftest.js'); const results=[runOrchestratorSelfTest(),runAgentRecoverySelfTest()]; console.log(JSON.stringify(results,null,2)); if(results.some(result=>!result.passed)) process.exit(1); })"

      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy exact validated commit
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4

      - name: Verify exact deploy commit
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) { throw "GITHUB_SHA is empty" }
          Write-Host "Deploy SHA: $env:GITHUB_SHA"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA" -Headers $headers -Method Get
          if ($commit.sha -ne $env:GITHUB_SHA) { throw "GitHub API deploy commit SHA mismatch" }
          Write-Host "Verified exact deploy commit: $($commit.sha)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
