name: MAULI 2.0 L1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-test:
    name: L1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Deterministic installs from the committed lockfile. A floating `npm install`
      # re-resolved wrangler on every run, so a deploy could ship a version the tests
      # never saw. `npm ci` also fails loudly if package.json and the lockfile diverge.
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Syntax / lint
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:routes

      # Proves the generated-app runtime verifier can actually execute a generated app and
      # tell a working app from a demo. MAULI must never ship a demo for a working product.
      - name: Generated-app runtime verification
        run: npm run test:runtime

      # Executes a generated product end to end: its Worker runs against a real D1 binding,
      # its session is enforced, its data survives a refresh and its live channel carries a
      # write to another client. Also proves the journey CATCHES a backend that fakes
      # success — "the backend is executed, not scanned".
      - name: Founder user journey (real backend execution)
        run: npm run verify:journey

      - name: Security + governance tests
        run: npm run test:security

      - name: Deep self-test
        run: npm run self-test

      - name: Wrangler configuration validation
        run: npx wrangler deploy --dry-run

      # A dry-run bundle proves the Worker compiles and the entry module exists. The
      # output directory is discarded; the deploy job rebuilds from the same revision.
      - name: Build verification
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir .build-check
          test -s .build-check/worker.js

  deploy:
    name: Deploy tested revision
    needs: l1-test
    if: ${{ github.event_name != 'pull_request' && needs.l1-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Cloudflare deployment failed after 3 attempts."
          exit 1

# Persistence stack is Workers + D1 + Durable Objects + Workers AI only. There is no
# object-storage binding of any kind, so deployment and CI must never require one.
