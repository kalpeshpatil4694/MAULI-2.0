name: MAULI 2.0 L1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-test:
    name: L1 validation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        run: node --check src/index.js
      - name: Run test suite
        run: npm test
      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run
