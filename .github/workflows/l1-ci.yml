name: MAULI 2.0 L1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-test:
    name: L1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript syntax check
        run: node --check src/index.js && node --check src/orchestrator.js

      - name: Run complete test suite
        run: npm test

      - name: Run deep self-test
        run: node --test tests/*.test.js

      - name: Validate Wrangler configuration and Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy tested revision
    needs: l1-test
    if: ${{ github.event_name != 'pull_request' && needs.l1-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Cloudflare deployment failed after 3 attempts."
          exit 1
