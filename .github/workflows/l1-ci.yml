name: MAULI 2.0 L1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-test:
    name: L1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Deterministic installs from the committed lockfile. A floating `npm install`
      # re-resolved wrangler on every run, so a deploy could ship a version the tests
      # never saw. `npm ci` also fails loudly if package.json and the lockfile diverge.
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Syntax / lint
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:routes

      # Proves the generated-app runtime verifier can actually execute a generated app and
      # tell a working app from a demo. MAULI must never ship a demo for a working product.
      - name: Generated-app runtime verification
        run: npm run test:runtime

      # Executes a generated product end to end: its Worker runs against a real D1 binding,
      # its session is enforced, its data survives a refresh and its live channel carries a
      # write to another client. Also proves the journey CATCHES a backend that fakes
      # success — "the backend is executed, not scanned".
      - name: Founder user journey (real backend execution)
        run: npm run verify:journey

      # The generated project's own deployment config, validated by wrangler itself. A
      # malformed wrangler.jsonc is invisible to every other check — the file parses as
      # JSONC and still fails `wrangler deploy`. This regenerates a real backend, runs its
      # migration through real SQLite, and refuses to pass unless a real
      # `wrangler deploy --dry-run` accepts the config and reports the D1 and Durable Object
      # bindings. The D1 500 that a deployed Worker returned came from a reserved-word table,
      # and this is where that is caught instead.
      - name: Generated wrangler configuration (wrangler deploy --dry-run)
        run: npm run verify:wrangler

      # The live channel, driven over a REAL TCP socket by a hand-rolled RFC 6455 client.
      # Every defect this covers was silent: the socket opened, the deployment succeeded and
      # every configuration check was green while the broadcast reached nobody. Confirms the
      # upgrade, the server-side confirmation, delivery to both connected clients exactly
      # once, a disconnected client being dropped, and a reconnected client receiving the
      # next write.
      - name: Live channel over a real WebSocket
        run: npm run verify:live

      # Production Runtime Acceptance, the gate between Functional Fidelity and QA.
      # The engine's own contract: a real generated product passes, a static-JSON backend is
      # caught as fake, a backend with no evidence is BLOCKED, a missing external credential
      # is DEPENDENCY_REQUIRED, and no critical requirement may lack runtime evidence.
      - name: Production runtime acceptance engine
        run: npm run verify:runtime

      # The deployment + identity contract: A backend + D1, B Backend + Auth,
      # C external API, D realtime, E browser-only, F executor unavailable,
      # G deployment failure, H wrong deployment URL, I wrong project identity,
      # J critical requirement without evidence, K repair → redeploy → retest,
      # L successful full delivery — plus the repair-loop bound.
      - name: Generated deployment + identity matrix
        run: npm run verify:deployment

      # The product, not just the rules. Three DIFFERENT founder commands are followed from
      # the command itself through specification → architecture → code → build → verification
      # → DEPLOY → the ACTUAL URL → real HTTP E2E → real persistence → auth/journey → core
      # business feature → requirement evidence → runtime gate → QA → integrity → delivery.
      #
      # Each chain prints every link. A link that produced no real evidence is printed as
      # BLOCKED, which is the point: a green tick here means the chain ran, not that a
      # deployment was faked.
      - name: Founder command → delivery chain (real HTTP E2E)
        run: node scripts/acceptance-chain.mjs --json acceptance-chain.json

      - name: Security + governance tests
        run: npm run test:security

      - name: Deep self-test
        run: npm run self-test

      - name: Wrangler configuration validation
        run: npx wrangler deploy --dry-run

      # A dry-run bundle proves the Worker compiles and the entry module exists. The
      # output directory is discarded; the deploy job rebuilds from the same revision.
      - name: Build verification
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir .build-check
          test -s .build-check/worker.js

  deploy:
    name: Deploy tested revision
    needs: l1-test
    if: ${{ github.event_name != 'pull_request' && needs.l1-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Cloudflare deployment failed after 3 attempts."
          exit 1

      # deploy → smoke → production runtime acceptance → final gate. The smoke proves the
      # MAULI Worker itself answers after a deploy.
      - name: Post-deploy smoke test
        env:
          MAULI_BASE_URL: ${{ vars.MAULI_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${MAULI_BASE_URL:-https://mauli-2-0.kalpeshpatil4694.workers.dev}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$BASE/api/health" | grep -q '"status"'; then
              echo "Smoke test passed: $BASE/api/health"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Post-deploy smoke test failed for $BASE/api/health"
          exit 1

      # GENERATED PROJECTS: a REAL deployment and a REAL HTTP acceptance.
      #
      # Three different founder commands are generated, built and deployed to Cloudflare
      # with this repository's own credentials, and the acceptance is then driven over the
      # network against the URL Cloudflare actually returned. Nothing here runs the source
      # in this process: the boundary is a real Worker with a real D1.
      - name: Generated projects - real deployment + real HTTP runtime acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Configuration failure::CLOUDFLARE_API_TOKEN is not configured, so generated projects cannot be deployed. Production runtime acceptance is BLOCKED - DEPENDENCY_REQUIRED, not a pass."
            {
              echo "## Generated projects - production runtime acceptance"
              echo ""
              echo "**BLOCKED - DEPENDENCY_REQUIRED (configuration).** CLOUDFLARE_API_TOKEN is not"
              echo "configured for this repository, so no generated project can be deployed and none can be"
              echo "runtime-verified. This is a configuration failure, not a product failure, and it is"
              echo "never reported as a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/acceptance-chain.mjs --deploy --json acceptance-chain.json | tee acceptance-chain.txt
          {
            echo "## Generated projects - production runtime acceptance"
            echo ""
            echo '```'
            cat acceptance-chain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE THREE STATES, kept visibly apart:
      #   A. configuration failure - this repository is missing a credential it needs
      #   B. generated-project runtime failure - a product did not survive its own acceptance
      #   C. external dependency BLOCKED - a third-party service has no credential
      #
      # A missing founder key is A, and it fails the release rather than letting a production
      # deploy look verified. It is deliberately NOT applied to the ordinary unit-test job,
      # which stays green so a credential problem never hides a real code regression.
      - name: Configuration - founder key required for per-project acceptance
        env:
          MAULI_FOUNDER_KEY: ${{ secrets.MAULI_FOUNDER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAULI_FOUNDER_KEY:-}" ]; then
            echo "::error title=Configuration failure::MAULI_FOUNDER_KEY is not configured for this repository. MAULI cannot authenticate the per-project production runtime sweep, so NO generated project can be runtime-verified and no delivery may be treated as production-verified."
            {
              echo ""
              echo "### A. Configuration failure"
              echo ""
              echo "MAULI_FOUNDER_KEY is not configured. MAULI cannot authenticate the per-project"
              echo "production runtime sweep. Every generated backend project therefore stays BLOCKED on"
              echo "runtime evidence, and its Final Delivery stays blocked. This is a configuration"
              echo "failure - not a product failure and not a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Founder key is configured (value never printed)."

      # Production runtime acceptance is AUTOMATIC and PER PROJECT. There is no fixed
      # MAULI_RUNTIME_PROJECT here any more: the sweep asks MAULI which projects have
      # generated code and no CURRENT passing runtime evidence, and MAULI answers for each
      # one by deploying it and running the acceptance over real HTTP against its own URL.
      - name: Production runtime acceptance (every generated project)
        env:
          MAULI_BASE_URL: ${{ vars.MAULI_BASE_URL }}
          MAULI_KEY: ${{ secrets.MAULI_FOUNDER_KEY }}
          MAULI_RUNTIME_FIXTURE: ${{ vars.MAULI_RUNTIME_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${MAULI_KEY:-}" ]; then
            echo "::error::MAULI_FOUNDER_KEY is missing at run time after the configuration step reported it present."
            exit 1
          fi
          BASE="${MAULI_BASE_URL:-https://mauli-2-0.kalpeshpatil4694.workers.dev}"
          if [ -n "${MAULI_RUNTIME_FIXTURE:-}" ]; then
            echo "::notice::Fixture mode: only the named project is re-tested. Production acceptance is per project and does not use this variable."
            BODY="{\"projectId\":\"${MAULI_RUNTIME_FIXTURE}\"}"
          else
            BODY='{"limit":25}'
          fi
          curl -fsS --max-time 600 -X POST "${BASE}/api/runtime-acceptance/sweep" \
            -H "x-mauli-founder: ${MAULI_KEY}" -H 'content-type: application/json' \
            -d "${BODY}" | tee /tmp/runtime-sweep.json
          echo
          node scripts/report-runtime-sweep.mjs /tmp/runtime-sweep.json

# Persistence stack is Workers + D1 + Durable Objects + Workers AI only. There is no
# object-storage binding of any kind, so deployment and CI must never require one.
