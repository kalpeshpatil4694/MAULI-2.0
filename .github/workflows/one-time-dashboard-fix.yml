name: One-time Dashboard Download Fix
on:
  push:
    branches: [fix/dashboard-download-eligibility-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch download/build eligibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dashboard.js')
          s=p.read_text()
          old="if(p.state==='completed'){"
          new="if(p.state==='completed' || STATE.artifacts.some(a=>a.projectId===p.id&&a.type==='final-delivery'&&a.metadata?.downloadPath) || STATE.artifacts.some(a=>a.projectId===p.id&&a.type==='code-workspace')){"
          if old not in s:
              raise SystemExit('Expected dashboard condition not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(dashboard): show available artifact actions for active projects"
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm .github/workflows/one-time-dashboard-fix.yml || true
          git diff --cached --quiet || (git commit -m "chore: remove one-time dashboard fix workflow" && git push)
