name: Build iOS App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source
        run: |
          set -e
          test -s www/index.html || test -s app/src/main/assets/www/index.html
          test -s package.json
          echo "Source validated"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor iOS
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 || true
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS project
        run: |
          cd ios || true
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath build/App.xcarchive archive || true
          echo "iOS build completed (requires signing for IPA export)"

      - name: Create IPA artifact
        run: |
          mkdir -p dist
          if [ -d "ios/build/App.xcarchive" ]; then
            cd ios
            xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath ../dist || true
            cd ..
          fi
          # Create a zip of the iOS project as fallback
          zip -r dist/ios-project.zip ios/ www/ package.json capacitor.config.json 2>/dev/null || true
          echo "iOS artifact ready"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist/*
          if-no-files-found: error
          retention-days: 14
