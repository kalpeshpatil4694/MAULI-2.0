name: Build Lifecycle Finalize
on:
  push:
    paths:
      - '.github/workflows/build-lifecycle-finalize.yml'
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Finalize build lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/index.js'); s=p.read_text()
          s=s.replace("wfLines.push('  group: mauli-build-\\refs/heads/main');", "wfLines.push('  group: mauli-build-$'+'{{ github.ref }}');")
          s=s.replace("wfLines.push('  group: mauli-build-\\${{ github.ref }}');", "wfLines.push('  group: mauli-build-$'+'{{ github.ref }}');")
          p.write_text(s)
          PY
          node --check src/index.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: preserve build workflow concurrency expression"
          git push
