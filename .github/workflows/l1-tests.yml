name: MAULI L1 Tests

# Secondary/manual regression suite. The canonical automatic gate is l1-ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-l1-manual
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run L1 tests
        run: npm test
