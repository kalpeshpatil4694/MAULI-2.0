name: Temporary dashboard escape fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Preserve JS escapes inside dashboard script template
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/dashboard.js';
          let s = fs.readFileSync(p, 'utf8');
          const start = s.indexOf('<script>');
          const end = s.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('dashboard script block not found');
          const head = s.slice(0, start);
          const block = s.slice(start, end);
          const tail = s.slice(end);
          const fixed = block.replace(/(?<!\\)\\(?!\\)/g, '\\\\');
          if (fixed === block) throw new Error('no single backslash escapes found');
          fs.writeFileSync(p, head + fixed + tail);
          NODE
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard.js
          git commit -m 'fix: preserve dashboard script escapes comprehensively'
          git push origin main
