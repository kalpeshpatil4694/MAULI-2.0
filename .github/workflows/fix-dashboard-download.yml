# Temporary targeted patch workflow; self-removes after patch.
name: Fix Dashboard Download Eligibility
on:
  push:
    branches: [fix/dashboard-download-eligibility-v3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted dashboard patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/dashboard.js')
          s=p.read_text()
          old="    if(p.state==='completed'){"
          new="    if(STATE.artifacts.some(a=>a.projectId===p.id&&(a.type==='final-delivery'||a.type==='code-workspace'))){"
          if old not in s:
              print('Target already patched; nothing to do')
          else:
              p.write_text(s.replace(old,new,1))
              print('Dashboard download/build eligibility patched')
          PY
          node --check src/dashboard.js
      - name: Commit dashboard patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard.js
          git commit -m 'fix(dashboard): show artifact actions for active projects' || true
          git rm -f .github/workflows/fix-dashboard-download.yml || true
          git add -u .github/workflows/fix-dashboard-download.yml || true
          git commit -m 'chore: remove temporary dashboard patch workflow' || true
          git push
