name: MAULI Self Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-selftest-manual
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Node tests
        run: node --test tests/*.test.js
      - name: Run MAULI health check
        run: node --input-type=module -e "import { runL1SelfTest } from './src/self-test.js'; const result = runL1SelfTest(); console.log('Self-test:', JSON.stringify(result, null, 2)); if (result.status !== 'ready') process.exit(1);"
