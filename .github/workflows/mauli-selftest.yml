name: MAULI Self Tests

on:
  workflow_run:
    workflows: ["MAULI 2.0 Tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mauli-selftest-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Node tests
        run: node --test tests/*.test.js
      - name: Run MAULI health check
        run: node --input-type=module -e "import { runL1SelfTest } from './src/self-test.js'; const result = runL1SelfTest(); console.log('Self-test:', JSON.stringify(result, null, 2)); if (result.status !== 'ready') process.exit(1);"
