name: MAULI Self Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install || bun install
      - name: Run Node tests
        run: node --test tests/*.test.js
      - name: Run MAULI health check
        run: |
          node -e "
          const { runL1SelfTest } = require('./src/self-test.js');
          const result = runL1SelfTest();
          console.log('Self-test:', JSON.stringify(result, null, 2));
          if (result.status !== 'ready') process.exit(1);
          "
