name: L1 Verify Trigger
on:
  push:
    paths:
      - '.github/workflows/l1-verify-trigger.yml'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger L1 CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 338316267 --ref main
