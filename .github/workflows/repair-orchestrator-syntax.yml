name: Repair orchestrator syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair missing function brace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/orchestrator.js')
          s = p.read_text()
          old = "artifactId:execution?.result?.artifactId??null},importance:'normal',...base);}}"
          new = "artifactId:execution?.result?.artifactId??null},importance:'normal',...base);}}}"
          if old not in s:
              raise SystemExit('Expected broken saveTaskMemory pattern was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/orchestrator.js
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-orchestrator-syntax.yml
          git add src/orchestrator.js .github/workflows/repair-orchestrator-syntax.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair orchestrator syntax"
          git push
